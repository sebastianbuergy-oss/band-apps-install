# Buergys Builds - macOS executor workflow.
#
# Belongs in the APP repository as .github/workflows/burgys-ios-build.yml.
# NOT installed by Buergys Builds: adding it to a repository is Sebastian's
# call (master brief, section 29), and the first real run needs his approval.
#
# Cost: standard GitHub-hosted macOS runners are free and unlimited on PUBLIC
# repositories. Never change `runs-on` to a larger runner - those are charged
# even on public repositories, and the cost guard classifies them as PAID.
name: Buergys Builds - iOS
run-name: ${{ inputs.build_id }} ${{ inputs.scheme }} ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Buergys Builds Build-ID (BB-YYYYMMDD-CODE-NNN)
        required: true
      commit:
        description: Commit, den Buergys Builds gepruef hat
        required: true
      mode:
        description: AD_HOC oder APP_STORE_RELEASE
        required: true
        default: AD_HOC
      scheme:
        required: true
      build_number:
        required: true
      marketing_version:
        required: true
      profile_name:
        required: true

permissions:
  contents: read

jobs:
  build:
    # Standard runner. Free on public repositories.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact commit Windows verified
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # Windows already ran preflight. This is the cheap second opinion, not
      # a replacement for it.
      - name: Preflight
        run: npm run check

      - name: XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Use the build number Buergys Builds allocated
        run: |
          set -euo pipefail
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" \
            "${{ inputs.scheme }}.xcodeproj/project.pbxproj"
          grep -c "CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};" \
            "${{ inputs.scheme }}.xcodeproj/project.pbxproj"

      # Signing material comes from repository secrets, never from Buergys
      # Builds and never from this file.
      - name: Import signing material
        env:
          CERT_P12_BASE64: ${{ secrets.BURGYS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BURGYS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BURGYS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/burgys.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/burgys.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$( [ "${{ inputs.mode }}" = "AD_HOC" ] && echo ad-hoc || echo app-store )</string>
            <key>teamID</key><string>${{ vars.BURGYS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>${{ vars.BURGYS_BUNDLE_ID }}</key><string>${{ inputs.profile_name }}</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -project "${{ inputs.scheme }}.xcodeproj" -scheme "${{ inputs.scheme }}" \
            -configuration Release -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination 'generic/platform=iOS' archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # Buergys Builds re-checks all of this on Windows too. Failing here just
      # saves a download.
      - name: Verify the export
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          WORK="$(mktemp -d)"; unzip -q "$IPA" -d "$WORK"
          APP="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "${{ inputs.build_number }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "${{ vars.BURGYS_BUNDLE_ID }}"
          test -f "$APP/web/index.html"
          codesign --verify --deep --strict "$APP"
          if [ "${{ inputs.mode }}" = "AD_HOC" ]; then
            security cms -D -i "$APP/embedded.mobileprovision" > "$WORK/p.plist"
            /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$WORK/p.plist" > /dev/null
          fi
          mkdir -p artifact && cp "$IPA" "artifact/${{ inputs.build_id }}.ipa"
          shasum -a 256 "artifact/${{ inputs.build_id }}.ipa" | tee "artifact/${{ inputs.build_id }}.sha256"

      - name: Upload the IPA for Buergys Builds to collect
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_id }}
          path: artifact/
          retention-days: 7

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/burgys.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/burgys.mobileprovision
